<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 تحدي الرخصة المهنية — عربي 2</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f3ed; --card: #fffdfa; --border: #e8e0d5; --border-soft: #f0e8dd;
  --text: #4a453e; --muted: #9a9188;
  --sage: #a3b899; --sage-dark: #8ba380; --sage-soft: #dfe8d8;
  --sky: #a8bfd0; --sand: #d9c4a0; --sand-soft: #efe4d0;
  --blush: #d9a8a8; --terracotta: #c49388;
  --success: #a3b899; --success-soft: #dfe8d8;
  --error: #c49388; --error-soft: #efd9d5;
  --warning: #d4b896;
  --shadow-sm: 0 1px 3px rgba(120,100,80,0.06);
  --shadow-md: 0 4px 20px rgba(120,100,80,0.08);
}
html, body { min-height: 100%; }
body {
  font-family: 'Tajawal','Segoe UI','Tahoma',sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7;
  overflow-x: hidden; min-height: 100vh; position: relative; padding-bottom: 80px;
}
.blob { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.4;
  pointer-events: none; z-index: 0; animation: float 26s infinite ease-in-out; }
.blob-1 { width: 500px; height: 500px; background: radial-gradient(circle, #d8e4d2, transparent); top:-180px; left:-150px; }
.blob-2 { width: 550px; height: 550px; background: radial-gradient(circle, #e5d5d0, transparent); bottom:-200px; right:-180px; animation-delay:-9s; }
.blob-3 { width: 400px; height: 400px; background: radial-gradient(circle, #d8e0e8, transparent); top:45%; left:50%; transform:translate(-50%,-50%); animation-delay:-16s; opacity:0.28; }
@keyframes float {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(40px,-30px) scale(1.08); }
}
header, .stats-bar, .progress-wrap, .controls, .filters, #questions-list, #empty-state { position: relative; z-index: 1; }
header { padding: 44px 20px 20px; text-align: center; max-width: 950px; margin: 0 auto; }
header h1 { font-size: clamp(26px,4.5vw,38px); font-weight: 900; margin-bottom: 10px; color: #6a6155; letter-spacing: -0.5px; }
header h1 .accent { background: linear-gradient(135deg, var(--sage-dark), var(--terracotta)); -webkit-background-clip: text; background-clip: text; color: transparent; }
header p { color: var(--muted); font-size: 15px; }
.stats-bar {
  max-width: 1000px; margin: 20px auto 14px; padding: 14px;
  background: var(--card); border: 1px solid var(--border-soft); border-radius: 20px;
  display: grid; grid-template-columns: repeat(5,1fr); gap: 10px;
  position: sticky; top: 12px; z-index: 100; box-shadow: var(--shadow-md);
}
@media(max-width: 640px) { .stats-bar { grid-template-columns: repeat(3,1fr); gap: 8px; padding: 10px; top: 6px; } }
.stat { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 12px; background: var(--bg); transition: transform 0.2s; }
.stat:hover { transform: translateY(-2px); }
.stat-icon { font-size: 20px; }
.stat-content { display: flex; flex-direction: column; }
.stat-value { font-size: 20px; font-weight: 900; line-height: 1.1; transition: color 0.3s; color: var(--text); }
.stat-label { font-size: 11px; color: var(--muted); }
.stat-correct .stat-value { color: var(--sage-dark); }
.stat-wrong .stat-value { color: var(--terracotta); }
.stat-streak .stat-value { color: var(--warning); }
.stat-time .stat-value { color: #8ba0b8; }
.progress-wrap { max-width: 1000px; margin: 0 auto 20px; padding: 0 14px; }
.progress-track { height: 8px; background: var(--border-soft); border-radius: 4px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--sage), var(--sky), var(--blush)); border-radius: 4px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); width: 0%; }
.controls { max-width: 1000px; margin: 0 auto 14px; padding: 0 14px; display: flex; gap: 10px; flex-wrap: wrap; }
#search { flex: 1; min-width: 200px; padding: 12px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 15px; outline: none; transition: all 0.2s; }
#search::placeholder { color: var(--muted); }
#search:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(163,184,153,0.18); }
.btn { padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--bg); border-color: var(--sage); transform: translateY(-2px); }
.btn.active { background: var(--sage); border-color: var(--sage-dark); color: white; }
.filters { max-width: 1000px; margin: 0 auto 20px; padding: 0 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn { padding: 8px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.filter-btn:hover { border-color: var(--sage); color: var(--sage-dark); background: var(--sage-soft); }
.filter-btn.active { background: var(--sage); border-color: var(--sage-dark); color: white; box-shadow: var(--shadow-sm); }
#questions-list { max-width: 1000px; margin: 0 auto; padding: 0 14px; }
.question { background: var(--card); border: 1px solid var(--border-soft); border-radius: 16px; padding: 22px; margin-bottom: 16px; transition: all 0.3s; position: relative; animation: slide-in 0.45s ease-out; box-shadow: var(--shadow-sm); }
@keyframes slide-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.question:hover { border-color: var(--border); box-shadow: var(--shadow-md); }
.q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.q-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.q-cat { padding: 3px 12px; background: var(--sage-soft); border: 1px solid #cdddc4; border-radius: 12px; font-size: 12px; font-weight: 700; color: var(--sage-dark); }
.q-num { font-size: 12px; color: var(--muted); }
.bookmark-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #c9bfb3; padding: 4px; transition: all 0.2s; }
.bookmark-btn:hover { transform: scale(1.2); color: var(--warning); }
.bookmark-btn.active { color: var(--warning); }
.q-text { font-size: 17px; font-weight: 500; margin-bottom: 16px; line-height: 1.8; color: var(--text); }
.options { display: grid; gap: 10px; margin-bottom: 16px; }
.option { padding: 13px 16px; background: var(--bg); border: 1.5px solid var(--border-soft); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 15px; position: relative; color: var(--text); }
.option:not(.locked):hover { background: var(--sand-soft); border-color: var(--sand); transform: translateX(-4px); }
.option.correct { background: var(--success-soft); border-color: var(--success); color: #5f7a56; font-weight: 700; padding-right: 42px; }
.option.correct::before { content: '✓'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--sage-dark); font-weight: 900; font-size: 18px; }
.option.wrong { background: var(--error-soft); border-color: var(--error); color: #8a5f58; padding-right: 42px; }
.option.wrong::before { content: '✗'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--terracotta); font-weight: 900; font-size: 18px; }
.option.dimmed { opacity: 0.4; }
.option.locked { cursor: default; }
.option.shake { animation: shake 0.45s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.answer { max-height: 0; overflow: hidden; opacity: 0; transition: all 0.5s ease; }
.answer.show { max-height: 600px; opacity: 1; margin-top: 16px; padding: 16px; background: var(--sage-soft); border-right: 3px solid var(--sage); border-radius: 10px; }
.answer-correct { font-weight: 700; color: var(--sage-dark); margin-bottom: 8px; }
.answer-evidence { color: #6a6155; font-size: 14px; line-height: 1.8; }
.answer-evidence b { color: var(--sage-dark); }
.confetti-piece { position: fixed; width: 9px; height: 9px; border-radius: 2px; pointer-events: none; z-index: 9999; animation: confetti-pop 1.3s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
@keyframes confetti-pop { 0% { transform: translate(-50%,-50%) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)),calc(-50% + var(--ty) + 300px)) rotate(var(--rot)) scale(0.3); opacity: 0; } }
#empty-state { max-width: 1000px; margin: 40px auto; padding: 60px 20px; text-align: center; color: var(--muted); font-size: 18px; }
#empty-state .emoji { font-size: 64px; display: block; margin-bottom: 16px; }
.hidden { display: none !important; }
.streak-fire { animation: fire-pulse 0.5s ease; }
@keyframes fire-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<header>
  <h1>تحدي <span class="accent">الرخصة المهنية</span> — عربي 2</h1>
  <p>اختبر نفسك بهدوء — إجابة فورية + دليل + إحصائيات لطيفة</p>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-icon">📊</div><div class="stat-content"><div class="stat-value" id="progress-val">0%</div><div class="stat-label">التقدم</div></div></div>
  <div class="stat stat-correct"><div class="stat-icon">✓</div><div class="stat-content"><div class="stat-value" id="correct-val">0</div><div class="stat-label">صحيح</div></div></div>
  <div class="stat stat-wrong"><div class="stat-icon">✗</div><div class="stat-content"><div class="stat-value" id="wrong-val">0</div><div class="stat-label">خطأ</div></div></div>
  <div class="stat stat-streak"><div class="stat-icon" id="streak-icon">🌿</div><div class="stat-content"><div class="stat-value" id="streak-val">0</div><div class="stat-label">تتابع</div></div></div>
  <div class="stat stat-time"><div class="stat-icon">⏱</div><div class="stat-content"><div class="stat-value" id="time-val">0:00</div><div class="stat-label">الوقت</div></div></div>
</div>

<div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div></div>

<div class="controls">
  <input type="text" id="search" placeholder="ابحث في السؤال أو الخيارات...">
  <button class="btn" id="shuffle-btn">🔀 عشوائي</button>
  <button class="btn active" id="sound-btn">🔊 الصوت</button>
  <button class="btn" id="reset-btn">🔄 تصفير</button>
</div>

<div class="filters" id="filters"></div>
<div id="questions-list"></div>
<div id="empty-state" class="hidden"><span class="emoji">🔎</span><p>لا توجد أسئلة تطابق بحثك</p></div>

<script>
const questionsData = [
/* ============ الدفعة الأولى — 60 سؤال ============ */
{cat:"نحو", q:"ما إعراب كلمة (مجتهدين) في جملة: «كان الطلابُ مجتهدين»؟", opts:["خبر كان منصوب بالياء","خبر كان منصوب بالفتحة","حال منصوب","نعت مجرور"], ans:"خبر كان منصوب بالياء", why:"«كان» فعل ناقص يرفع الاسم وينصب الخبر، و«مجتهدين» جمع مذكر سالم، وعلامة نصبه <b>الياء</b>."},
{cat:"نحو", q:"في جملة «إنّ المعلمَ مخلصٌ» — ما إعراب (المعلمَ)؟", opts:["اسم إنّ منصوب بالفتحة","فاعل مرفوع","مبتدأ مرفوع","مفعول به"], ans:"اسم إنّ منصوب بالفتحة", why:"«إنّ» من الحروف الناسخة، تنصب الاسم وترفع الخبر، فـ«المعلمَ» اسمها منصوب بالفتحة."},
{cat:"نحو", q:"«ظننتُ الجوَّ باردًا» — ما إعراب (باردًا)؟", opts:["مفعول به ثانٍ","حال منصوب","خبر مرفوع","تمييز"], ans:"مفعول به ثانٍ", why:"«ظنّ» تنصب مفعولين أصلهما مبتدأ وخبر. «الجوَّ» مفعول أول و«باردًا» <b>مفعول به ثانٍ</b>."},
{cat:"نحو", q:"«أعطيتُ الفقيرَ درهمًا» — ما إعراب (درهمًا)؟", opts:["مفعول به ثانٍ","مفعول به أول","تمييز","حال"], ans:"مفعول به ثانٍ", why:"«أعطى» يتعدى لمفعولين: «الفقيرَ» (من أُعطي)، و«درهمًا» (ما أُعطي) = <b>مفعول به ثانٍ</b>."},
{cat:"نحو", q:"«ما جاء إلا محمدٌ» — ما إعراب (محمدٌ)؟", opts:["فاعل مرفوع","بدل مرفوع","مبتدأ","خبر"], ans:"فاعل مرفوع", why:"«ما» نافية و«إلا» أداة حصر، و«محمدٌ» فاعل مرفوع لفعل «جاء» المحذوف."},
{cat:"نحو", q:"«ما رأيتُ إلا محمدًا» — ما إعراب (محمدًا)؟", opts:["مفعول به منصوب","فاعل","بدل","مستثنى"], ans:"مفعول به منصوب", why:"عند حذف المستثنى منه، «محمدًا» <b>مفعول به</b> منصوب للفعل «رأى»."},
{cat:"نحو", q:"«متى تسافرْ أسافرْ» — ما إعراب الفعلين؟", opts:["فعل شرط مجزوم + جواب مجزوم","مرفوعان","منصوبان","أحدهما مجزوم والآخر مرفوع"], ans:"فعل شرط مجزوم + جواب مجزوم", why:"«متى» أداة شرط جازمة تجزم فعل الشرط والجواب."},
{cat:"نحو", q:"«إنْ تدرسْ تنجحْ» — ما علامة جزم (تنجحْ)؟", opts:["حذف حرف العلة","السكون","حذف النون","الفتحة"], ans:"السكون", why:"«تنجحْ» مضارع صحيح الآخر، وعلامة جزمه <b>السكون</b>."},
{cat:"نحو", q:"«عسى اللهُ أن يشفيك» — ما نوع (عسى)؟", opts:["فعل من أفعال الرجاء","فعل من أفعال المقاربة","فعل تام","حرف"], ans:"فعل من أفعال الرجاء", why:"أفعال الرجاء: عسى، حرى، اخلولق. وأفعال المقاربة: كاد، أوشك، كرب."},
{cat:"نحو", q:"«كاد المطرُ ينزل» — ما إعراب (ينزل)؟", opts:["فعل مضارع مرفوع في محل نصب خبر كاد","فعل منصوب بأن مقدرة","فعل مجزوم","فعل مرفوع في محل جر"], ans:"فعل مضارع مرفوع في محل نصب خبر كاد", why:"«كاد» من أفعال المقاربة، خبرها جملة فعلية فعلها مضارع <b>مرفوع</b> بدون «أن»."},
{cat:"نحو", q:"«أينما تذهبْ تجدْ خيرًا» — إعراب (أينما)؟", opts:["اسم شرط جازم في محل نصب على الظرفية","حرف شرط جازم","اسم استفهام","حرف جر"], ans:"اسم شرط جازم في محل نصب على الظرفية", why:"«أينما» اسم شرط جازم في محل نصب على الظرفية المكانية، يجزم فعلين."},
{cat:"نحو", q:"«لكنَّ الطلابَ مجتهدون» — ما عمل (لكنَّ) المشددة؟", opts:["تعمل عمل إنّ: تنصب الاسم وترفع الخبر","تنصب مفعولين","ترفع المبتدأ فقط","لا تعمل شيئًا"], ans:"تعمل عمل إنّ: تنصب الاسم وترفع الخبر", why:"«لكنّ» المشددة من أخوات «إنّ»، فتنصب الاسم (الطلابَ) وترفع الخبر (مجتهدون)."},
{cat:"نحو", q:"«أصبح الجوُّ باردًا» — ما نوع (أصبح)؟", opts:["فعل ناقص (من أخوات كان)","فعل تام","فعل مضارع","حرف ناسخ"], ans:"فعل ناقص (من أخوات كان)", why:"«أصبح» من الأفعال الناقصة (أخوات كان) التي ترفع الاسم وتنصب الخبر."},
{cat:"نحو", q:"ما إعراب (الذي) في: «رأيتُ الذي نجحَ»؟", opts:["اسم موصول في محل نصب مفعول به","اسم موصول في محل رفع فاعل","حرف","صفة"], ans:"اسم موصول في محل نصب مفعول به", why:"«الذي» اسم موصول مبني في محل نصب <b>مفعول به</b>، وجملة «نجحَ» صلة الموصول."},
{cat:"نحو", q:"في «أعجبني ما صنعتَ» — ما نوع (ما)؟", opts:["موصولة اسمية في محل رفع فاعل","نافية","استفهامية","مصدرية"], ans:"موصولة اسمية في محل رفع فاعل", why:"«ما» اسم موصول بمعنى «الذي»، والموصول في محل رفع <b>فاعل</b>."},
{cat:"بلاغة", q:"«زيدٌ كالأسدِ» — ما نوع التشبيه؟", opts:["تشبيه مرسل مجمل","تشبيه بليغ","تشبيه مؤكد مفصل","استعارة"], ans:"تشبيه مرسل مجمل", why:"<b>مرسل</b> لأن الأداة (الكاف) مذكورة، و<b>مجمل</b> لأن وجه الشبه محذوف."},
{cat:"بلاغة", q:"«رأيتُ أسدًا يخطبُ في الناس» — نوع الصورة؟", opts:["استعارة تصريحية","استعارة مكنية","تشبيه بليغ","كناية"], ans:"استعارة تصريحية", why:"شبّه الخطيب بالأسد ثم <b>حذف المشبه (الخطيب) وصرّح بالمشبه به (الأسد)</b>."},
{cat:"بلاغة", q:"«ابتسم الصباحُ» — نوع الصورة؟", opts:["استعارة مكنية","استعارة تصريحية","تشبيه مرسل","مجاز مرسل"], ans:"استعارة مكنية", why:"شبّه الصباح بالإنسان ثم <b>حذف المشبه به وأبقى إحدى صفاته</b>."},
{cat:"بلاغة", q:"«فلانٌ طويلُ اليدِ» كناية عن السخاء — ما نوع الكناية؟", opts:["كناية عن صفة","كناية عن موصوف","كناية عن نسبة","مجاز مرسل"], ans:"كناية عن صفة", why:"«طويل اليد» صفة لازمة للسخي، والمراد لازم المعنى = <b>كناية عن صفة</b>."},
{cat:"بلاغة", q:"«العلمُ نورٌ والجهلُ ظلامٌ» — المحسن البديعي؟", opts:["طباق إيجاب","جناس تام","سجع","مقابلة"], ans:"طباق إيجاب", why:"«العلم» ضد «الجهل» و«نور» ضد «ظلام» = <b>طباق إيجاب</b>."},
{cat:"بلاغة", q:"«صليتُ المغربَ في المغربِ» — المحسن؟", opts:["جناس تام","طباق","سجع","تصريع"], ans:"جناس تام", why:"«المغرب» (الصلاة) و«المغرب» (البلد) اتفقتا في الحروف واختلفتا في المعنى = <b>جناس تام</b>."},
{cat:"بلاغة", q:"«إنما اللهُ إلهٌ واحد» — الأسلوب البلاغي؟", opts:["قصر بـ«إنما»","تشبيه","استعارة","كناية"], ans:"قصر بـ«إنما»", why:"«إنما» أداة قصر تفيد إثبات الحكم للمذكور ونفيه عما سواه."},
{cat:"بلاغة", q:"«وما محمدٌ إلا رسولٌ» — الأسلوب البلاغي؟", opts:["قصر بـ«ما...إلا»","تشبيه مرسل","طباق","جناس"], ans:"قصر بـ«ما...إلا»", why:"«ما» نافية و«إلا» أداة حصر = قصر الموصوف على الصفة."},
{cat:"بلاغة", q:"«فلانٌ كثيرُ الرمادِ» كناية عن الكرم — نوعها؟", opts:["كناية عن صفة","كناية عن نسبة","كناية عن موصوف","استعارة"], ans:"كناية عن صفة", why:"كثرة الرماد تدل على كثرة الطبخ = صفة ملازمة للكريم."},

{cat:"نحو", q:"«ما جاء من أحدٍ» — ما إعراب (أحد)؟", opts:["فاعل مجرور لفظًا مرفوع محلًّا","مفعول به","مبتدأ","مجرور بالكسرة الظاهرة"], ans:"فاعل مجرور لفظًا مرفوع محلًّا", why:"«من» حرف جر زائد للتوكيد، و«أحد» فاعل مرفوع بضمة مقدرة منع من ظهورها اشتغال المحل بحركة حرف الجر الزائد."},
{cat:"نحو", q:"«إنَّ زيدًا قائمٌ» — ما عمل (إنّ)؟", opts:["تنصب المبتدأ وترفع الخبر","ترفع المبتدأ وتنصب الخبر","تجزم الفعل المضارع","لا عمل لها"], ans:"تنصب المبتدأ وترفع الخبر", why:"«إنّ» حرف ناسخ ينصب المبتدأ ويسمى اسمها، ويرفع الخبر ويسمى خبرها."},
{cat:"نحو", q:"«لا رجلَ ظالمٌ محبوبٌ» — ما حكم اسم (لا) النافية للجنس؟", opts:["مبني على الفتح في محل نصب لأنه مفرد","معرب منصوب بالفتحة","مرفوع بالضمة","مجرور بالكسرة"], ans:"مبني على الفتح في محل نصب لأنه مفرد", why:"إذا كان اسم «لا» النافية للجنس مفردًا (غير مضاف ولا شبيه بالمضاف)، فإنه يُبنى على ما ينصب به في محل نصب."},
{cat:"نحو", q:"«بئسَ صفةً الكذبُ» — ما إعراب (الكذبُ)؟", opts:["فاعل مرفوع و«صفةً» تمييز منصوب","فاعل مستتر","مبتدأ مؤخر","بدل مرفوع"], ans:"فاعل مرفوع و«صفةً» تمييز منصوب", why:"«بئس» فعل جامد للذم. الكذبُ فاعل مرفوع، و«صفةً» تمييز منصوب (والفاعل هنا اسم ظاهر لا مستتر)."},
{cat:"نحو", q:"«أكرِمْ بالمجتهدِ» — ما صيغة الفعل وإعراب (المجتهد)؟", opts:["فعل ماضٍ جاء بصيغة الأمر للتعجب، والمجتهد فاعل مجرور لفظًا مرفوع محلًّا","فعل أمر حقيقي","فعل مضارع","مبتدأ مرفوع"], ans:"فعل ماضٍ جاء بصيغة الأمر للتعجب، والمجتهد فاعل مجرور لفظًا مرفوع محلًّا", why:"أسلوب التعجب القياسي بصيغة «أفْعِلْ به» يتكون من فعل ماضٍ جاء على صيغة الأمر للإنشاء، وباء زائدة، وفاعل مجرور لفظًا مرفوع محلًّا."},
{cat:"نحو", q:"«حضر الطلابُ إلا طالبًا» — ما إعراب (طالبًا) في الاستثناء التام المثبت؟", opts:["مستثنى منصوب وجوبًا","مبدل منه","مبتدأ","بدل مرفوع"], ans:"مستثنى منصوب وجوبًا", why:"في الاستثناء التام المثبت (الكلام غير منفي، والمستثنى منه مذكور)، يجب نصب المستثنى بـ«إلا»."},
{cat:"نحو", q:"«ما حضر الطلابُ إلا طالبٌ / إلا طالبًا» — إعراب (طالبٌ) البدل:", opts:["بدل مرفوع من الطلابِ","مستثنى منصوب فقط","مفعول به","اسم مجرور"], ans:"بدل مرفوع من الطلابِ", why:"الكلام منفي وتام (المستثنى منه مذكور)، فيجوز النصب على الاستثناء، أو الإتباع على البدلية من المستثنى منه المرفوع."},
{cat:"نحو", q:"«لا تحترقْ بالنارِ» — نوع الناهية وإعراب الفعل بعدها:", opts:["لا الناهية الجازمة، وفعل مضارع مجزوم بالسكون","لا النافية غير الجازمة، وفعل مرفوع","حرف استئناف","فعل ماضٍ"], ans:"لا الناهية الجازمة، وفعل مضارع مجزوم بالسكون", why:"«لا» الناهية تطلب الإقلاع عن الفعل وتجزمه، والفعل بعدها مضارع مجزوم."},
{cat:"نحو", q:"«واللهمَّ لأسعيَنَّ في الخير» — ما حكم توكيد الفعل بالنون؟", opts:["واجب التوكيد لأنه واقع في جواب قسم مثبت متصل باللام غير فارق","ممتنع","جائز","قليل"], ans:"واجب التوكيد لأنه واقع في جواب قسم مثبت متصل باللام غير فارق", why:"يجب توكيد المضارع بالنون إذا وقع جوابًا لقسم، مثبتًا، متصلًا بلام القسم، دالًا على المستقبل."},
{cat:"نحو", q:"«أنتِ تكتُبينَ الدرسَ» — ما إعراب الفعل المضارع هنا؟", opts:["فعل مضارع مرفوع بثبوت النون لأنه من الأفعال الخمسة","مجزوم","مبني على الفتح","منصوب"], ans:"فعل مضارع مرفوع بثبوت النون لأنه من الأفعال الخمسة", why:"الأفعال الخمسة كل مضارع اتصلت به واو الجماعة أو ألف الاثنين أو ياء المخاطبة، وتُرفع بثبوت النون."},
{cat:"نحو", q:"«إنْ تسعَ في الخيرِ تنلْ خيرًا» — ما إعراب فعلي الشرط والجواب؟", opts:["مجزومان وعلامة جزميهما حذف حرف العلة والسكون","مرفوعان","منصوبان","مبنيان"], ans:"مجزومان وعلامة جزميهما حذف حرف العلة والسكون", why:"«تسعَ» فعل الشرط مجزوم بحذف حرف العلة، و«تنلْ» جواب الشرط مجزوم بالسكون وحذفت الألف قبلها للساكنين."},
{cat:"نحو", q:"«نِعْمَ العبدُ أيوبُ» — الفعل (نعم) والفاعل:", opts:["«نعم» فعل مدح جامد، و«العبدُ» فاعل مرفوع معرف بالتعريف الجنسي","فعل متصرف","اسم","حرف"], ans:"«نعم» فعل مدح جامد، و«العبدُ» فاعل مرفوع معرف بالتعريف الجنسي", why:"أفعال المدح والذم (نعم، بئس، حبذا) جامدة، وفاعلها يأتي معرفًا بأل أو مضافًا لما فيه أل."},
{cat:"نحو", q:"«يا رجلاً خذْ بيدِي» — نوع المنادى:", opts:["نكرة غير مقصودة منصوبة","نكرة مقصودة مبنية","علم مفرد","مضاف"], ans:"نكرة غير مقصودة منصوبة", why:"لأن المنادى نكرة غير معينة توجه النداء إليها، فيُنصب وعلامة نصبه الفتحة."},
{cat:"نحو", q:"«سافر أخواك» — علامة رفع (أخواك):", opts:["الألف لأنه ملحق بالمثنى (أو مثنى)","الواو","الضمة","النون"], ans:"الألف لأنه ملحق بالمثنى (أو مثنى)", why:"المثنى يُرفع بالألف ويُنصب ويُجر بالياء، وكلمة «أخوان» تُعرب إعراب المثنى بالحروف."},
{cat:"نحو", q:"«رأيتُ اثني عشرَ طالباً» — إعراب العدد المركب (اثني عشر):", opts:["«اثنا» ملحق بالمثنى منصوب بالياء، و«عشر» جزء مبني لا محل له","مرفوع بالضمة","مبني على الفتح قطعيًا","مجرور"], ans:"«اثنا» ملحق بالمثنى منصوب بالياء، و«عشر» جزء مبني لا محل له", why:"الأعداد المركبة من (11-19) ما عدا (12) تُبنى على فتح الجزأين، أما (12) فصدرها يُعرب إعراب المثنى وعجزها حرف مبني."},
{cat:"صرف", q:"«استخرج» — ما وزن الكلمة الصرفي؟", opts:["اسْتَفْعَلَ","اِفْعَللَ","تَفَعَّلَ","فَعَلَ"], ans:"اسْتَفْعَلَ", why:"أصل الكلمة (خرج) على وزن (فعل)، وبزيادة الهمزة والسين والتاء تصبح على وزن (استفعل)."},
{cat:"صرف", q:"«مِفْتاح» — ما وزن اسم الآلة؟", opts:["مِفْعَال","مِفْعَل","فَاعِل","فَعِيل"], ans:"مِفْعَال", why:"أوزان اسم الآلة القياسية ثلاثة: مِفْعَل، مِفْعَال، مِفْعَلَة."},
{cat:"صرف", q:"«كاتب» — اسم فاعل لفعل:", opts:["ثلاثي (كتب)","رباعي","خماسي","سداسي"], ans:"ثلاثي (كتب)", why:"اسم الفاعل من الثلاثي يصاغ على وزن (فاعل)، ومن غير الثلاثي بمبدل حرف المضارعة ميمًا مضمومة وكسر ما قبل الآخر."},
{cat:"صرف", q:"«مُستَخْرَج» — اسم مفعول لفعل:", opts:["غير ثلاثي (استخرج)","ثلاثي","اسم جامد","صفة مشبهة"], ans:"غير ثلاثي (استخرج)", why:"اسم المفعول من غير الثلاثي يأتي بميم مضمومة وفتح ما قبل الآخر."},
{cat:"صرف", q:"«أحمر» — صفة مشبهة مؤنثها:", opts:["حَمْرَاء","حَمِيرَة","حَمَّارَة","حَمْرَانة"], ans:"حَمْرَاء", why:"الصفة المشبهة الدالة على لون أو عيب تأتي على وزن (أَفْعَل) ومؤنثها (فَعْلَاء)."},
{cat:"صرف", q:"«موقف» — أصله الصرفي قبل الإعلال:", opts:["مَوْقِف (على وزن مِفْعِل)","مَاقِف","مِيقَف","مَفْقَف"], ans:"مَوْقِف (على وزن مِفْعِل)", why:"وَقَعَ الفعل مثالًا واويّاً، وحذفت واوه في المضارع والأمر، وفي اسم الزمان والمكان الصحيح يبقى على وزنه."},
{cat:"صرف", q:"«قال» — أصل الألف في وسط الفعل الثلاثي:", opts:["واو (قول)","ياء (قيل)","همزة","ساكنة"], ans:"واو (قول)", why:"معرفة أصل ألف الفعل تكون بالرجوع للمضارع (يقول) أو المصدر (قولًا)، فأصلها واو."},
{cat:"صرف", q:"«باع» — أصل الألف في وسط الفعل:", opts:["ياء (بيع)","واو","ألف","هاء"], ans:"ياء (بيع)", why:"مضارعها (يبيع) ومصدرها (بيعًا)، فأصل الألف ياء."},
{cat:"صرف", q:"مصدر الفعل الرباعي «أكرمَ»:", opts:["إكرامًا","تكريمًا","استكْرَامًا","كرامةً"], ans:"إكرامًا", why:"مصادر الأفعال الرباعية قياسية، فالوزن (أَفْعَلَ) مصدره على وزن (إِفْعَال)."},
{cat:"صرف", q:"مصدر الفعل الخماسي «انطلقَ»:", opts:["انطلاقًا","تطويرًا","استخراجًا","دحرجةً"], ans:"انطلاقًا", why:"الفعل الخماسي المبدوء بهمزة وصل يكون مصدره بكسر ثالثه وزيادة ألف قبل الآخر (انفعال)."},
{cat:"صرف", q:"مصدر الفعل الثلاثي اللازم على وزن (فَعُلَ):", opts:["فُعُولَة أو فَعَامَة (مثل: سُهُولَة)","فِعَالَة","فَعْل","فِعَال"], ans:"فُعُولَة أو فَعَامَة (مثل: سُهُولَة)", why:"الفعل الثلاثي اللازم إذا كان على وزن (فَعُلَ) كان مصدره القياسي على وزن (فُعُولَة) أو (فَعَامَة)."},
{cat:"صرف", q:"تصغير كلمة «رَجُل»:", opts:["رُجَيْل","رَجِيل","رُجَيلان","أريجال"], ans:"رُجَيْل", why:"التصغير الثلاثي يرد الاسم إلى وزنه المصغر (فُعَيْل)، بضم أوله وفتح ثانيه وزيادة ياء التصغير ساكنة."},
{cat:"صرف", q:"نسبة الاسم المقصور «عصا»:", opts:["عَصَوِيّ","عِصِيّ","عَصَائِيّ","عَصِيّ"], ans:"عَصَوِيّ", why:"في النسب إلى الاسم المقصور إذا كانت ألفه ثالثة رُدّت إلى أصلها (الواو)، فتقول عَصَوِيّ."},
{cat:"صرف", q:"تثنية الاسم المنقوص «قَاضِي»:", opts:["قَاضِيَانِ","قَاضَانِ","قَاضِيَينِ بحذف الياء","قُضَاة"], ans:"قَاضِيَانِ", why:"عند تثنية المنقوص لا تحذف ياءه بل تبقى وتُفتح إن كانت رابعة فصاعدًا، ويُضاف علامة التثنية."},
{cat:"صرف", q:"جمع المؤنث السالم لكلمة «فاطمة»:", opts:["فَاطِمَات","فَوَاطِمُ","فَاطِميَّات","فُطْم"], ans:"فَاطِمَات", why:"جمع المؤنث السالم يُجمع بزيادة ألف وتاء مبسوطة على المفرد سالمًا من التغيير الجذري."},

/* ---------- بلاغة وعروض (25) ---------- */
{cat:"بلاغة", q:"«الاستعارة المكنية» هي:", opts:["ما حُذِفَ فيها المشبه به وبقي شيء من لوازمه دال عليه","ما صُرّح فيها بالمشبه به","ما كُنّي بها عن صفة","تشبيه تام الأركان"], ans:"ما حُذِفَ فيها المشبه به وبقي شيء من لوازمه دال عليه", why:"الاستعارة المكنية هي التي يُحذف فيها المشبه به ويُرمز له بشيء من لوازمه (مثل: أنياب الدهر)."},
{cat:"بلاغة", q:"«أرسلتُ عيوني في المدينة» — نوع المجاز المرسل:", opts:["الجزئية (أراد العيون جاسوسًا وذكره ببعضه)","الكلية","السببية","الحالية"], ans:"الجزئية (أراد العيون جاسوسًا وذكره ببعضه)", why:"أطلق الجزء (العين) وأراد الكل (الجاسوس) علاقة جزئية."},
{cat:"بلاغة", q:"«فليدعُ ناديه سندعُ الزبانية» — نوع الكناية:", opts:["كناية عن صفة القوة والبطش","كناية عن موصوف","تشبيه بليغ","استعارة تصريحية"], ans:"كناية عن صفة القوة والبطش", why:"الكناية لفظ أُطلق وأُريد به لازم معناه مع جواز إرادة المعنى الأصلي."},
{cat:"بلاغة", q:"«وما أبحرَ العشاقُ إلا تلطفًا» — أسلوب القصر هنا بطريق:", opts:["النفي والاستثناء (ما... إلا)","إنما","عطف بلا أو لكن","التعريف"], ans:"النفي والاستثناء (ما... إلا)", why:"من طرق القصر المشهورة: النفي بـ(ما) والاستثناء بـ(إلا) لتخصيص الصفة بالموصوف أو العكس."},
{cat:"بلاغة", q:"«إنما المجدُ بالسعي لا الكسل» — أسلوب القصر بـ:", opts:["أداة (إنما) والعطف بـ(لا)","الاستثناء","تقديم الجار والمجرور","النداء"], ans:"أداة (إنما) والعطف بـ(لا)", why:"استخدمت أداة القصر «إنما» بالإضافة إلى العطف بحرف «لا» لنفي الحكم عما بعده وإثباته لما قبله."},
{cat:"بلاغة", q:"«ألا يا صبْرُ خُذْ بي» — نوع الأسلوب في الشطر:", opts:["إنشائي طلبي (نداء وتمني أو أمر)","خبري لفظًا إنشائي معنى","خبري بحت","إنشائي غير طلبي"], ans:"إنشائي طلبي (نداء وتمني أو أمر)", why:"النداء والأمر من أساليب الإنشاء الطلبي الصريح."},
{cat:"بلاغة", q:"ما الفرق الأساسي بين الطباق والمقابلة؟", opts:["الطباق بين ضدين اثنين، والمقابلة بين معنيين متقابلين أو أكثر على الترتيب","لا فرق بينهما","الطباق في النثر فقط","المقابلة في الشعر العامي"], ans:"الطباق بين ضدين اثنين، والمقابلة بين معنيين متقابلين أو أكثر على الترتيب", why:"الطباق تضاد مفردات (أبيض/أسود)، بينما المقابلة توافق وتخالف جمل بمتعدداتها."},
{cat:"بلاغة", q:"«حسن التقسيم» في البديع اللفظي يعني:", opts:["تقسيم البيت أو الجملة أجزاء متساوية متناغمة الإيقاع","تعدد القوافي","التشابه في الحروف","كثرة السجع"], ans:"تقسيم البيت أو الجملة أجزاء متساوية متناغمة الإيقاع", why:"حسن التقسيم محسن بديعي لفظي يعطي نغمة موسيقية عبر تقطيع العبارة وحدات متساوية."},
{cat:"بلاغة", q:"التورية في البديع المعنوي تعني:", opts:["ذكر لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفي مراد","الاشتراك اللفظي فقط","تكرار الكلمة","قلب الحروف"], ans:"ذكر لفظ له معنيان: قريب ظاهر غير مراد، وبعيد خفي مراد", why:"التورية تورق المعنى الخفي المقصود وتبهره وراء لفظ يحتمل معنيين."},
{cat:"بلاغة", q:"«الالتفات» بلاغيًّا هو:", opts:["الانتقال من ضمير إلى ضمير آخر لإثارة الذهن","تكرار الكلمات","اختلاف الأوزان","تغيير القافية"], ans:"الانتقال من ضمير إلى ضمير آخر لإثارة الذهن", why:"الالتفات أسلوب بياني يحرك الملل ويجذب انتباه السامع بتغيير الضمائر (متكلم، مخاطب، غائب)."},
{cat:"بلاغة", q:"«إيجاز القصر» هو:", opts:["إيجاز بلاغي يتم بتضمين المعاني الكثيرة في ألفاظ قليلة موجزة","حذف حرف","حذف جملة كاملة","الإطناب بالترادف"], ans:"إيجاز بلاغي يتم بتضمين المعاني الكثيرة في ألفاظ قليلة موجزة", why:"إيجاز القصر (أو جوامع الكلم) يعبر عن معانٍ جليلة متعددة بعبارات قصيرة دقيقة."},
{cat:"بلاغة", q:"«الإطناب بالتكرار» يُؤتى به لـ:", opts:["التأكيد أو التحسر أو التهويل","التطويل بلا فائدة","تغيير الوزن","الإبهام"], ans:"التأكيد أو التحسر أو التهويل", why:"التكرار محسن بياني بليغ يُقصد به تأكيد المعنى أو تقويته في نفس السامع."},
{cat:"عروض", q:"مكونات علم العروض الأساسية التي وضعها الخليل بن أحمد:", opts:["الأسباب والأوتاد والفواصل","التفعيلات الكبرى فقط","البحور الصامتة","الزوائد الصرفية"], ans:"الأسباب والأوتاد والفواصل", why:"وضع الخليل بن أحمد الفراهيدي علم العروض معتمداً على وحدات إيقاعية صوتية فرعية وهي الأسباب والأوتاد والفواصل."},
{cat:"عروض", q:"السبب الخفيف في العروض يتكون من:", opts:["حرف متحرك فساكن (مثل: لَمْ)","حرفان متحركان","ثلاثة أحرف متحركة","حرف مشدد"], ans:"حرف متحرك فساكن (مثل: لَمْ)", why:"السبب الخفيف مكون من حرفين: متحرك فساكن، ويرمز له بـ(/ه)."},
{cat:"عروض", q:"الوتد المجموع يتكون من:", opts:["حرفان متحركان فساكن (مثل: بَدَا)","ثلاثة أحرف متحركة","حرفان ساكنان","حرف متحرك واحد"], ans:"حرفان متحركان فساكن (مثل: بَدَا)", why:"الوتد المجموع مكون من ثلاثة أحرف: متحركين فساكن ويرمز له بـ(//ه)."},
{cat:"عروض", q:"ما هي عروض وضرب البحر الطويل التامة؟", opts:["عروضه مقبوضة وضربه مقبوض تام أو صحيح","عروضه صحيحة","ضربه مجزوء","بدون عروض"], ans:"عروضه مقبوضة وضربه مقبوض تام أو صحيح", why:"الطويل يأتي بصيغ دقيقة عروضه مقبوضة غالبًا (فعولن) وضربه صحيح أو مقبوض."},
{cat:"عروض", q:"ماذا يقصد بالزحاف في عروض الشعر؟", opts:["تغيير يصيب ثواني الأسباب دون الروي أو التفعيلة الأساسية في الحشو","تغيير في آخر البيت فقط","زيادة في القافية","كسر الوزن تمامًا"], ans:"تغيير يصيب ثواني الأسباب دون الروي أو التفعيلة الأساسية في الحشو", why:"الزحاف تغيير خفيف يجري في حشو البيت (الثواني من الأسباب)، وهو جائز وغير لازم بخلاف العلل."},
{cat:"عروض", q:"ماذا يقصد بـ«العلة» في عروض الشعر؟", opts:["تغيير طارئ لازم في العروض أو الضرب ويجري في أواخر الأبيات","تغيير في الحشو فقط","خطأ إملائي","جواز شعري"], ans:"تغيير طارئ لازم في العروض أو الضرب ويجري في أواخر الأبيات", why:"العلة تغيير يلحق أعاريض الأبيات وأضربها ويكون لازمًا إذا التزم الشاعر به."},
{cat:"عروض", q:"البحر العروضي الذي تفعيلته (مستفعلن فاعلن) أربع مرات:", opts:["البحر البسيط","الطويل","الكامل","الوافر"], ans:"البحر البسيط", why:"البحر البسيط يتكون من تفعيلات مستفعلن فاعلن مستفعلن فاعلن تامًا."},
{cat:"عروض", q:"البحر الأكثر استخدامًا في الشعر العربي القديم:", opts:["البحر الطويل","البحر الكامل","البحر المتقارب","البحر الرمل"], ans:"البحر الطويل", why:"البحر الطويل يمثل أكثر من ثلث الشعر العربي القديم لسهولته وعذوبته واتساع طاقته التعبيرية."},
{cat:"عروض", q:"القصيدة العمودية التقليدية تشترط في القافية أن تكون:", opts:["موحدة الروي والحرف الأخير في كل الأبيات","متغيرة في كل بيت","بدون قافية","حرة منثورة"], ans:"موحدة الروي والحرف الأخير في كل الأبيات", why:"الشعر العمودي الكلاسيكي يعتمد على وحدة الوزن (البحر) ووحدة القافية والروي."},
{cat:"عروض", q:"«الروي» هو:", opts:["الحرف الأخير الذي تُبنى عليه القصيدة وتُنسب إليه","حرف العلة الأول","التفعيلة الكبرى","الزحاف المفرد"], ans:"الحرف الأخير الذي تُبنى عليه القصيدة وتُنسب إليه", why:"حرف الروي هو الحرف الصحيح الأخير في البيت الذي تلتزم به القصيدة كلها (مثل: لامية العرب، دالية زهير)."},
{cat:"عروض", q:"«المُقَفَّى» في الشعر هو:", opts:["البيت الذي انتهى بقافية متطابقة","البيت الخليلو الجافي","الشعر الحر المنثور","الشعر الغنائي"], ans:"البيت الذي انتهى بقافية متطابقة", why:"المقفى هو كل شعر التزم بقافية موحدة في أواخر أبياتها."},
{cat:"عروض", q:"البحر الذي جاء على وزن (متفاعلن متفاعلن متفاعلن) هو:", opts:["البحر الكامل","البحر الوافر","البحر الرجز","البحر الخفيف"], ans:"البحر الكامل", why:"البحر الكامل سمي كاملًا لاكتمال حركاته، وتفعيلته متفاعلن مكررة."},
{cat:"عروض", q:"البحر الذي تتألف تفعيلاته من (مفاعلتن مفاعلتن فعولن) هو:", opts:["البحر الوافر","البحر الكامل","البحر الطويل","البحر المتقارب"], ans:"البحر الوافر", why:"البحر الوافر يتميز بنغمته الهادئة وتفعيلاته الخماسية (مفاعلتن مفاعلتن فعولن)."},

/* ---------- أدب وتاريخ الأدب (24) ---------- */
{cat:"أدب", q:"العصر الجاهلي يمتد للفترة الزمنية التي سبقت الإسلام بـ:", opts:["قرن ونصف إلى قرنين من الزمن تقريبًا","ألف سنة","عشر سنوات","عهد الخلفاء الراشدين"], ans:"قرن ونصف إلى قرنين من الزمن تقريبًا", why:"العصر الجاهلي هو الفترة التي سبقت ظهور الإسلام بنحو 150 إلى 200 سنة، وفيه ازدهر الشعر والنثر الجاهلي."},
{cat:"أدب", q:"من أبرز شعراء المعلقات المشهورين بلقب (الملك الضليل):", opts:["امرؤ القيس بن حجر الكندي","طرفة بن العبد","زهير بن أبي سلمى","عمرو بن كلثوم"], ans:"امرؤ القيس بن حجر الكندي", why:"امرؤ القيس أمير شعراء الجاهلية وصاحب أول معلقة مشهورة ولقب بـ(الملك الضليل)."},
{cat:"أدب", q:"قصيدة «ألا هُبّي بِصَحْنِكِ فَاصْبَحِينَا» هي المعلقة الشهيرة للشاعر:", opts:["عمرو بن كلثوم","الحارث بن حلزة","طرفة بن العبد","عنترة بن شداد"], ans:"عمرو بن كلثوم", why:"معلقة عمرو بن كلثوم التغلبي من المعلقات الخالدة في الفخر والحماسة وتبدأ بهذا المطلع."},
{cat:"أدب", q:"صاحب معلقة «أمن أم أوفى دمنة لم تكلم» هو:", opts:["زهير بن أبي سلمى","لبيد بن ربيعة","طرفة بن العبد","عنترة"], ans:"زهير بن أبي سلمى", why:"معلقة زهير بن أبي سلمى تبدأ بـ«أمن أم أوفى دمنة لم تكلم» وهي في الحكمة والسلام ومدح السلم."},
{cat:"أدب", q:"الأدب في العصر الإسلامي والأموي تأثر بشكل مباشر بـ:", opts:["القرآن الكريم والحديث الشريف والفتح الإسلامي","الفارسية القديمة فحسب","الثقافة اليونانية الفلسفية البحتة","الأساطير الوثنية"], ans:"القرآن الكريم والحديث الشريف والفتح الإسلامي", why:"نزل القرآن الكريم فتحول لغة العرب وأدبهم نحو الفصاحة والسمو، والقرآن والحديث مصدرا إلهام."},
{cat:"أدب", q:"من أشهر شعراء النقائض في العصر الأموي:", opts:["الفرزدق، وجرير، والأخطل","امرؤ القيس وعنترة","أبو تمام والبحتري","المتنبي والمعري"], ans:"الفرزدق، وجرير، والأخطل", why:"فَنّ النقائض ظهر في العصر الأموي وازدهر بين شعراء ثلاثي المعارك الشعرية: جرير والفرزدق والأخطل."},
{cat:"أدب", q:"العصر العباسي يُعد العصر الذهبي للأدب العربي بسبب:", opts:["تنوع الثقافات والترجمة وازدهار النثر والشعر والتأليف الفكري الموسوعي","انحسار الثقافة","اقتصاره على البادية","انعدام المدن"], ans:"تنوع الثقافات والترجمة وازدهار النثر والشعر والتأليف الفكري الموسوعي", why:"شهد العصر العباسي نهضة شاملة وتأثر بالثقافات الفارسية والهندية واليونانية وازدهار الفنون النثرية."},
{cat:"أدب", q:"من أقطاب الشعر العباسي المجددين في البديع واللفظ صاحب كتاب «الحماسة»:", opts:["أبو تمام حبيب بن أوس","البحتري","المتنبي","أبو نواس"], ans:"أبو تمام حبيب بن أوس", why:"أبو تمام شاعر العصر العباسي الفذ وصاحب الصنعة البديعية الكبرى ومؤلف «ديوان الحماسة»."},
{cat:"أدب", q:"الشاعر المتنبي (أبو الطيب أحمد بن الحسين) يُعد بحق:", opts:["ملء الشعر وشاغل الناس وعملاق الشعر العربي عبر العصور","أحد شعراء العصر الجاهلي","مؤسس الشعر الحر الحديث","من شعراء المهجر الجنوبي"], ans:"ملء الشعر وشاغل الناس وعملاق الشعر العربي عبر العصور", why:"المتنبي يعد أعظم شعراء العرب في قوة الفخر والحكمة وجزالة الألفاظ وثقة النفس العالية."},
{cat:"أدب", q:"«الشريف الرضي» هو جامع خطب ورسائل الإمام علي بن أبي طالب الموسومة بـ:", opts:["نهج البلاغة","البداية والنهاية","الأغاني","العقد الفريد"], ans:"نهج البلاغة", why:"الشريف الرضي جمع كتاب «نهج البلاغة» الذي يضم مختارات من خطب ووصايا الإمام علي بن أبي طالب."},
{cat:"أدب", q:"من مؤلفات الأديب الأندلسي ابن حزم الأندلسي الشهيرة في الحب والألفة:", opts:["طوق الحمامة في الألفة والألاف","مقدمة ابن خلدون","حي بن يقظان","رسالة الغفران"], ans:"طوق الحمامة في الألفة والألاف", why:"«طوق الحمامة» كتاب فريد لابن حزم في دراسة الحب الإنساني وعلله وأخباره في الأندلس."},
{cat:"أدب", q:"قصبة الأدب الأندلسي الشعرية اشتهرت بظهور فنون مستحدثة مثل:", opts:["الموشحات والأزجال","المعلقات الطويلة","النقائض البدوية","شعر الرثاء الجاهلي"], ans:"الموشحات والأزجال", why:"ابتكر الأندلسيون الفنون الشعرية الموسيقية الجديدة كالموشحات والأزجال التي تتخللها أقفال وأغصان."},
{cat:"أدب", q:"مدرسة الإحياء والبعث في الشعر العربي الحديث أسسها وأعاد لها روحها:", opts:["محمود سامي البارودي","أحمد شوقي","إبراهيم ناجي","عباس العقاد"], ans:"محمود سامي البارودي", why:"رائد مدرسة الإحياء والبعث هو رائد النهضة الشعرية الحديثة محمود سامي البارودي (رب السيف والقلم)."},
{cat:"أدب", q:"مدرسة الديوان الأدبية في الشعر العربي الحديث تميزت بـ:", opts:["الجموح الرومانسي، والاهتمام بالتحليل الفكري، ونبذ الشعر التقليدي","مدح الملوك والأمراء","الالتزام العروضي الحرفي البحت بدون عواطف","الشعر الساخر السياسي"], ans:"الجموح الرومانسي، والاهتمام بالتحليل الفكري، ونبذ الشعر التقليدي", why:"مدرسة الديوان (العقاد، المازني، شكري) دعت إلى التجديد والوحدة العضوية وربط الشعر بالفكر النفسي والفلسفي."},
{cat:"أدب", q:"جماعة «أبوللو» الشعرية الرومانسية كان من أقطابها البارزين:", opts:["أحمد زكي أبو شادي وإبراهيم ناجي وعلي محمود طه","العقاد وشكري","المتنبي وأبو تمام","بدر شاكر السياب"], ans:"أحمد زكي أبو شادي وإبراهيم ناجي وعلي محمود طه", why:"جماعة أبوللو تأسست عام 1932م في مصر ومثلت الاتجاه الوجداني الرومانسي الحر في الشعر العربي."},
{cat:"أدب", q:"قصيدة «الأطلال» المشهورة التي تغنت بها أم كلثوم هي للشاعر:", opts:["إبراهيم ناجي","أحمد شوقي","محمود درويش","خليل مطران"], ans:"إبراهيم ناجي", why:"«الأطلال» من درر الشعر الرومانسي العربي للشاعر الطبيب إبراهيم ناجي من جماعة أبوللو."},
{cat:"أدب", q:"الرابطة القلمية في المهجر الشمالي (أمريكا الشمالية) رأسها الأديب:", opts:["جبران خليل جبران","إيليا أبو ماضي","أمين الريحاني","ميخائيل نعيمة"], ans:"جبران خليل جبران", why:"الرابطة القلمية تأسست في نيويورك عام 1920م وبرئاسة جبران خليل جبران لتجديد الأدب العربي مهجريًّا."},
{cat:"أدب", q:"العصبة الأندلسية في المهجر الجنوبي (أمريكا الجنوبية) كان من شعرائها البارزين:", opts:["إلياس فرحات ورشيد سليم الخوري وشفيق معلوف","جبران وميخائيل نعيمة","أحمد شوقي والبارودي","العقاد"], ans:"إلياس فرحات ورشيد سليم الخوري وشفيق معلوف", why:"العصبة الأندلسية تأسست في البرازيل عام 1932م وعنيت بالحفاظ على التراث مع لمسة مهجرية رقيقة."},
{cat:"أدب", q:"حركة «الشعر الحر» أو «الشعر التفعيلي» ظهرت ملامحها وتأصلت في منتصف القرن العشرين على يد:", opts:["نازك الملائكة وبدر شاكر السياب","أحمد شوقي","المتنبي","ابن زيدون"], ans:"نازك الملائكة وبدر شاكر السياب", why:"ظهر الشعر الحر (التفعيلي) الذي يعتمد وحدة التفعيلة لا الشطرين المتساويين في العراق على يد نازك الملائكة والسياب نحو 1947م."},
{cat:"أدب", q:"رواية «زينب» لمحمد حسين هيكل تُعد تاريخيًا:", opts:["أول رواية فنية مصرية وعربية متكاملة الأركان الفنية","أول مسرحية شعرية","ديوان نقدي قديم","أول قصة قصيرة عالمية"], ans:"أول رواية فنية مصرية وعربية متكاملة الأركان الفنية", why:"صدرت رواية «زينب» عام 1914م وتُعتبر البداية الحقيقية لفن الرواية العربية الفنية الحديثة."},
{cat:"أدب", q:"من أبرز المسرحيات الشعرية للشاعر أحمد شوقي (أمير الشعراء):", opts:["مجنون ليلى، مصرع كليوباترا، أميرة الأندلس، علي بك الكبير","أهل الكهف","شهرزاد","السلطان الحائر"], ans:"مجنون ليلى، مصرع كليوباترا، أميرة الأندلس، علي بك الكبير", why:"أحمد شوقي رائد المسرح الشعري العربي وله مسرحيات خالدة مثل مجنون ليلى ومصرع كليوباترا."},
{cat:"أدب", q:"أدب الرحلات في التراث العربي زخر بكتب خالدة، من أشهرها رحلة:", opts:["ابن بطوطة (تحفة النظار في غرائب الأمصار وعجائب الأسفار)","الجاحظ","المقريزي","ابن خلدون"], ans:"ابن بطوطة (تحفة النظار في غرائب الأمصار وعجائب الأسفار)", why:"ابن بطوطة رحالة الإسلام العظيم الذي دوّن رحلته التاريخية الكبرى في كتابه الموسوعي الشهير برحلة ابن بطوطة."},
{cat:"أدب", q:"«كتاب الأغاني» الموسوعة الأدبية التاريخية الكبرى هو من تصنيف وضبط:", opts:["أبو الفرج الأصفهاني","الجاحظ","المبرد","ابن قتيبة"], ans:"أبو الفرج الأصفهاني", why:"«الأغاني» لأبي الفرج الأصفهاني يُعد سجلًا جامعًا لأخبار الشعراء والغناء والأدب والتاريخ في العصرين الأموي والعباسي."},
{cat:"أدب", q:"كتب الأمثال كـ«مجمع الأمثال» للميداني تُعد مرجعًا في:", opts:["الأمثال الشعبية والفصحى ودلالاتها التاريخية والثقافية","علوم الفلك","النحو المبسط","الرياضيات"], ans:"الأمثال الشعبية والفصحى ودلالاتها التاريخية والثقافية", why:"كتب الأمثال العربية مثل مجمع الأمثال للميداني تضيء على بلاغة العرب وحكمهم وسياقات قصص أمثالهم."},

/* ---------- نقد ومهارات تدريس (20) ---------- */
{cat:"نقد", q:"المنهج النقدي الحديث الذي يركز على النص وحده دون اعتبار لحياة المؤلف أو عصره هو:", opts:["المنهج البنيوي (الشكلاني)","المنهج التاريخي","المنهج النفسي","المنهج الاجتماعي"], ans:"المنهج البنيوي (الشكلاني)", why:"المنهج البنيوي يتعامل مع النص الأدبي كبنية مغلقة متكاملة بذاتها ويقصي العوامل الخارجية للمؤلف والتاريخ."},
{cat:"نقد", q:"المنهج الذي يربط بين الأدب وبيئة المجتمع والظروف المحيطة وتأثيرها هو:", opts:["المنهج الاجتماعي (أو الماركسي/البيئي)","المنهج الفني البحت","المنهج الأسلوبي","المنهج اللغوي الصرف"], ans:"المنهج الاجتماعي (أو الماركسي/البيئي)", why:"المنهج الاجتماعي يدرس الأدب باعتباره ظاهرة اجتماعية تعكس واقع المجتمع ومشكلاته وطبقاته."},
{cat:"نقد", q:"المنهج النفسي في نقد الأدب يركز على:", opts:["دراسة نفسية الأديب، ودوافعه اللاشعورية، وعقد الطفولة وانعكاسها على نصه","تاريخ العصور","القواعد الصرفية","طرق تدريس النحو"], ans:"دراسة نفسية الأديب، ودوافعه اللاشعورية، وعقد الطفولة وانعكاسها على نصه", why:"المنهج النفسي يستلهم نظريات علم النفس (كفرويد وغيره) لتحليل العقد والدوافع الخفية خلف الإبداع الأدبي."},
{cat:"نقد", q:"«التناص» (Intertextuality) كمصطلح نقدي حديث يعني:", opts:["تداخل النص الأدبي مع نصوص أخرى سابقة وتوظيفها دلاليًّا","سرقة أدبية واضحة","سوء فهم النص","الترجمة الحرفية"], ans:"تداخل النص الأدبي مع نصوص أخرى سابقة وتوظيفها دلاليًّا", why:"التناص هو حضور نص داخل نص آخر وإقامة حوارية دلالية بينهما بعمق ثقافي."},
{cat:"نقد", q:"«التلقي» أو نظرية استجابة القارئ في النقد الحديث تجعل محور العملية النقدية:", opts:["القارئ ودوره الفاعل في إنتاج المعنى واستنطاقه من النص","المؤلف وحده","الناشر","حجم الكتاب"], ans:"القارئ ودوره الفاعل في إنتاج المعنى واستنطاقه من النص", why:"نظرية القارئ والتلقي (ياوس، إيزر) تنقل مركز الاهتمام من المؤلف أو النص إلى القارئ وتأويلاته."},
{cat:"مهارات تدريس", q:"أفضل طريقة لتدريس مهارة القراءة الصامتة في الصفوف العليا هي:", opts:["تحديد هدف القراءة مسبقًا، وتحديد وقت محدد، ثم طرح أسئلة قياسية للاستيعاب","قراءة المعلم بصوت صاخب","إجبار الطلاب على الحفظ","قراءة الكلمات بطيئًا"], ans:"تحديد هدف القراءة مسبقًا، وتحديد وقت محدد، ثم طرح أسئلة قياسية للاستيعاب", why:"القراءة الصامتة تهدف للفهم المباشر وتتطلب تهيئة بوجود هدف زمني وموضوعي واضح."},

/* خلط الخيارات */
let shuffledOptions = {};
function shuffleAllOptions() {
  shuffledOptions = {};
  questionsData.forEach((q, i) => {
    const indices = q.opts.map((_, idx) => idx);
    for (let k = indices.length - 1; k > 0; k--) {
      const j = Math.floor(Math.random() * (k + 1));
      [indices[k], indices[j]] = [indices[j], indices[k]];
    }
    shuffledOptions[i] = indices;
  });
}

const state = { answered: {}, bookmarked: {}, streak: 0, maxStreak: 0, soundOn: true, sessionStart: Date.now() };
let currentFilter = 'الكل';
let searchTerm = '';
let displayOrder = questionsData.map((_, i) => i);

let audioCtx = null;
function playTone(freq, duration, type='sine', delay=0) {
  if (!state.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type;
    const t = audioCtx.currentTime + delay;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.06, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t); osc.stop(t + duration);
  } catch(e) {}
}
function playCorrect() { playTone(523.25, 0.15, 'sine', 0); playTone(659.25, 0.15, 'sine', 0.1); playTone(783.99, 0.22, 'sine', 0.2); }
function playWrong() { playTone(392, 0.15, 'sine', 0); playTone(329.63, 0.22, 'sine', 0.1); }

function confettiFrom(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const colors = ['#a3b899','#a8bfd0','#d9a8a8','#d9c4a0','#c49388','#c5b8d0'];
  for (let i = 0; i < 24; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = cx + 'px';
    piece.style.top = cy + 'px';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    const angle = Math.random() * Math.PI * 2;
    const vel = 60 + Math.random() * 160;
    piece.style.setProperty('--tx', (Math.cos(angle)*vel) + 'px');
    piece.style.setProperty('--ty', (Math.sin(angle)*vel - 70) + 'px');
    piece.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 1300);
  }
}

function updateStats() {
  const answeredCount = Object.keys(state.answered).length;
  const total = questionsData.length;
  const correct = Object.values(state.answered).filter(a => a.correct).length;
  const wrong = answeredCount - correct;
  const percent = Math.round(answeredCount / total * 100);
  document.getElementById('progress-val').textContent = percent + '%';
  document.getElementById('correct-val').textContent = correct;
  document.getElementById('wrong-val').textContent = wrong;
  document.getElementById('streak-val').textContent = state.streak;
  document.getElementById('progress-bar').style.width = percent + '%';
}
function updateTimer() {
  const elapsed = Math.floor((Date.now() - state.sessionStart) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('time-val').textContent = m + ':' + String(s).padStart(2, '0');
}
setInterval(updateTimer, 1000);

function buildFilters() {
  const container = document.getElementById('filters');
  container.innerHTML = '';
  const cats = ['الكل', ...new Set(questionsData.map(q => q.cat)), '⭐ المحفوظة'];
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === currentFilter ? ' active' : '');
    btn.dataset.cat = cat;
    let count;
    if (cat === 'الكل') count = questionsData.length;
    else if (cat === '⭐ المحفوظة') count = Object.values(state.bookmarked).filter(Boolean).length;
    else count = questionsData.filter(q => q.cat === cat).length;
    btn.textContent = cat + ' (' + count + ')';
    btn.addEventListener('click', () => {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    });
    container.appendChild(btn);
  });
}

function getFilteredQuestions() {
  return displayOrder.filter(i => {
    const q = questionsData[i];
    if (currentFilter === '⭐ المحفوظة') {
      if (!state.bookmarked[i]) return false;
    } else if (currentFilter !== 'الكل') {
      if (q.cat !== currentFilter) return false;
    }
    if (searchTerm) {
      const hay = (q.q + ' ' + q.opts.join(' ') + ' ' + q.cat).toLowerCase();
      if (!hay.includes(searchTerm.toLowerCase())) return false;
    }
    return true;
  });
}

function createQuestionCard(q, qIndex, displayNum) {
  const card = document.createElement('div');
  card.className = 'question';
  card.dataset.index = qIndex;
  const ans = state.answered[qIndex];
  const bookmarked = !!state.bookmarked[qIndex];
  const order = shuffledOptions[qIndex] || q.opts.map((_, i) => i);
  const displayOpts = order.map(idx => q.opts[idx]);

  let optionsHtml = '';
  displayOpts.forEach((opt, displayIdx) => {
    let cls = 'option';
    if (ans) {
      cls += ' locked';
      if (opt === q.ans) cls += ' correct';
      else if (displayIdx === ans.selected) cls += ' wrong';
      else cls += ' dimmed';
    }
    optionsHtml += `<div class="${cls}" data-opt-index="${displayIdx}">${opt}</div>`;
  });

  card.innerHTML = `
    <div class="q-header">
      <div class="q-meta">
        <span class="q-cat">${q.cat}</span>
        <span class="q-num">سؤال ${displayNum}</span>
      </div>
      <button class="bookmark-btn ${bookmarked ? 'active' : ''}" title="حفظ">${bookmarked ? '★' : '☆'}</button>
    </div>
    <div class="q-text">${q.q}</div>
    <div class="options">${optionsHtml}</div>
    <div class="answer ${ans ? 'show' : ''}">
      <div class="answer-correct">✓ الإجابة: ${q.ans}</div>
      <div class="answer-evidence"><b>الدليل:</b> ${q.why}</div>
    </div>
  `;

  card.querySelectorAll('.option').forEach((optEl, displayIdx) => {
    optEl.addEventListener('click', () => {
      handleOptionClick(qIndex, displayIdx, optEl, card);
    });
  });

  card.querySelector('.bookmark-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    state.bookmarked[qIndex] = !state.bookmarked[qIndex];
    e.target.textContent = state.bookmarked[qIndex] ? '★' : '☆';
    e.target.classList.toggle('active');
    const count = Object.values(state.bookmarked).filter(Boolean).length;
    const bmBtn = [...document.querySelectorAll('.filter-btn')].find(b => b.dataset.cat === '⭐ المحفوظة');
    if (bmBtn) bmBtn.textContent = '⭐ المحفوظة (' + count + ')';
    if (currentFilter === '⭐ المحفوظة') renderAll();
  });

  return card;
}

function handleOptionClick(qIndex, displayIdx, optEl, card) {
  if (state.answered[qIndex]) return;
  const q = questionsData[qIndex];
  const order = shuffledOptions[qIndex];
  const selectedText = q.opts[order[displayIdx]];
  const isCorrect = selectedText === q.ans;
  state.answered[qIndex] = { selected: displayIdx, correct: isCorrect };
  if (isCorrect) {
    state.streak++;
    state.maxStreak = Math.max(state.maxStreak, state.streak);
    playCorrect();
    confettiFrom(optEl);
    optEl.classList.add('correct');
    const icon = document.getElementById('streak-icon');
    icon.classList.remove('streak-fire');
    void icon.offsetWidth;
    icon.classList.add('streak-fire');
  } else {
    state.streak = 0;
    playWrong();
    optEl.classList.add('wrong', 'shake');
    card.querySelectorAll('.option').forEach(opt => {
      if (opt.textContent.trim() === q.ans) opt.classList.add('correct');
    });
  }
  card.querySelectorAll('.option').forEach(opt => {
    opt.classList.add('locked');
    if (!opt.classList.contains('correct') && !opt.classList.contains('wrong')) {
      opt.classList.add('dimmed');
    }
  });
  card.querySelector('.answer').classList.add('show');
  updateStats();
}

function renderAll() {
  const filtered = getFilteredQuestions();
  const list = document.getElementById('questions-list');
  const emptyState = document.getElementById('empty-state');
  list.innerHTML = '';
  if (filtered.length === 0) { emptyState.classList.remove('hidden'); return; }
  emptyState.classList.add('hidden');
  filtered.forEach((qIndex, i) => {
    list.appendChild(createQuestionCard(questionsData[qIndex], qIndex, i + 1));
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim();
  renderAll();
});
document.getElementById('shuffle-btn').addEventListener('click', function() {
  const a = [...displayOrder];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  displayOrder = a;
  this.classList.toggle('active');
  renderAll();
});
document.getElementById('sound-btn').addEventListener('click', function() {
  state.soundOn = !state.soundOn;
  this.classList.toggle('active', state.soundOn);
  this.textContent = state.soundOn ? '🔊 الصوت' : '🔇 صامت';
});
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('هل أنت متأكد من تصفير كل التقدم؟')) return;
  state.answered = {}; state.bookmarked = {}; state.streak = 0; state.maxStreak = 0;
  state.sessionStart = Date.now();
  displayOrder = questionsData.map((_, i) => i);
  currentFilter = 'الكل';
  searchTerm = '';
  document.getElementById('search').value = '';
  shuffleAllOptions();
  buildFilters(); updateStats(); renderAll();
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const cards = [...document.querySelectorAll('.question')];
  for (const card of cards) {
    const idx = parseInt(card.dataset.index);
    if (state.answered[idx]) continue;
    const options = card.querySelectorAll('.option');
    const rect = card.getBoundingClientRect();
    const visible = rect.top < window.innerHeight && rect.bottom > 0;
    if (!visible) continue;
    if (e.key >= '1' && e.key <= '4') {
      const oi = parseInt(e.key) - 1;
      if (options[oi]) options[oi].click();
      return;
    }
  }
});

shuffleAllOptions();
buildFilters(); updateStats(); updateTimer(); renderAll();
</script>
